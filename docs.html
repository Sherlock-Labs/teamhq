<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherlock Labs | Docs</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-violet: #8B5CF6;
      --surface-low: #F9FAFB;
      --text-main: #374151;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #FAFAFA;
      color: var(--text-main);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .premium-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
    }

    .subtle-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-pill {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid white;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6px;
      font-weight: 700;
      color: #6B7280;
    }

    .doc-row {
      transition: background-color 100ms ease;
    }

    .doc-row:hover {
      background-color: #F9FAFB;
    }

    .doc-group-header {
      cursor: pointer;
      user-select: none;
      transition: background-color 100ms ease;
    }

    .doc-group-header:hover {
      background-color: #F3F4F6;
    }

    .chevron {
      transition: transform 150ms ease;
    }

    .chevron.collapsed {
      transform: rotate(-90deg);
    }

    .doc-content {
      font-size: 12px;
      line-height: 1.7;
    }

    .doc-content h1 { font-size: 16px; font-weight: 700; margin: 20px 0 8px; color: #111827; }
    .doc-content h2 { font-size: 14px; font-weight: 700; margin: 16px 0 6px; color: #111827; }
    .doc-content h3 { font-size: 13px; font-weight: 600; margin: 14px 0 4px; color: #374151; }
    .doc-content p { margin: 6px 0; color: #4B5563; }
    .doc-content ul, .doc-content ol { margin: 6px 0; padding-left: 20px; color: #4B5563; }
    .doc-content li { margin: 2px 0; }
    .doc-content code { font-family: 'JetBrains Mono', monospace; font-size: 11px; background: #F3F4F6; padding: 1px 4px; border-radius: 2px; }
    .doc-content pre { background: #F9FAFB; border: 1px solid #F3F4F6; border-radius: 4px; padding: 12px; margin: 8px 0; overflow-x: auto; }
    .doc-content pre code { background: none; padding: 0; }
    .doc-content blockquote { border-left: 2px solid #E5E7EB; padding-left: 12px; margin: 8px 0; color: #6B7280; }
    .doc-content table { border-collapse: collapse; margin: 8px 0; font-size: 11px; }
    .doc-content th, .doc-content td { border: 1px solid #F3F4F6; padding: 4px 8px; text-align: left; }
    .doc-content th { background: #F9FAFB; font-weight: 600; }
    .doc-content a { color: #3B82F6; text-decoration: none; }
    .doc-content a:hover { text-decoration: underline; }
    .doc-content hr { border: none; border-top: 1px solid #F3F4F6; margin: 16px 0; }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #E5E7EB;
      border-radius: 2px;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/lib/marked.umd.min.js"></script>
  <script>
    const API_BASE = '/api';

    const TYPE_COLORS = {
      'requirements': { color: '#3B82F6', bg: '#3B82F611' },
      'tech-approach': { color: '#8B5CF6', bg: '#8B5CF611' },
      'design-spec': { color: '#EC4899', bg: '#EC489911' },
      'research': { color: '#14B8A6', bg: '#14B8A611' },
      'messaging': { color: '#F59E0B', bg: '#F59E0B11' },
      'retrospective': { color: '#6366F1', bg: '#6366F111' },
      'other': { color: '#9CA3AF', bg: '#9CA3AF11' },
    };

    function timeAgo(ts) {
      if (!ts) return '';
      const diff = Date.now() - new Date(ts).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    function agentInitials(name) {
      if (!name) return '??';
      return name.slice(0, 2).toUpperCase();
    }

    let allGroups = [];
    let searchQuery = '';
    let collapsedGroups = new Set();

    async function loadDocs() {
      try {
        const res = await fetch(API_BASE + '/docs');
        const data = await res.json();

        document.getElementById('header-total').textContent = data.summary?.totalDocs || 0;
        document.getElementById('header-projects').textContent = data.summary?.totalProjects || 0;

        allGroups = data.groups || [];
        renderDocList();
      } catch (err) {
        console.error('Failed to load docs:', err);
        document.getElementById('doc-list').innerHTML =
          '<div class="px-4 py-8 text-center text-[11px] text-gray-400">Failed to load docs</div>';
      }
    }

    function renderDocList() {
      const el = document.getElementById('doc-list');
      let groups = allGroups;

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        groups = groups.map(g => ({
          ...g,
          docs: g.docs.filter(d =>
            d.title.toLowerCase().includes(q) ||
            d.path.toLowerCase().includes(q) ||
            (d.typeLabel || '').toLowerCase().includes(q)
          ),
        })).filter(g => g.docs.length > 0);
      }

      if (groups.length === 0) {
        el.innerHTML = '<div class="px-4 py-8 text-center text-[11px] text-gray-400">No documents found</div>';
        return;
      }

      el.innerHTML = groups.map(g => {
        const isCollapsed = collapsedGroups.has(g.project);
        return `
          <div>
            <div class="doc-group-header flex items-center justify-between px-4 py-2 bg-gray-50/50"
                 onclick="toggleDocGroup('${g.project.replace(/'/g, "\\'")}')">
              <div class="flex items-center gap-2">
                <svg class="w-2.5 h-2.5 text-gray-400 chevron ${isCollapsed ? 'collapsed' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
                <span class="text-[11px] font-bold text-gray-600">${g.label}</span>
              </div>
              <span class="text-[10px] text-gray-400">${g.docCount}</span>
            </div>
            ${isCollapsed ? '' : g.docs.map(d => {
              const tc = TYPE_COLORS[d.type] || TYPE_COLORS['other'];
              return `
                <div class="doc-row px-4 py-2 cursor-pointer flex items-center gap-3"
                     onclick="loadDoc('${d.path.replace(/'/g, "\\'")}', '${d.title.replace(/'/g, "\\'")}', '${d.typeLabel || 'Doc'}', ${d.readingTime || 0})">
                  <div class="min-w-0 flex-1">
                    <div class="text-[11px] text-black truncate">${d.title}</div>
                    <div class="flex items-center gap-2 mt-0.5">
                      <span class="tag-pill" style="color:${tc.color};background:${tc.bg}">${d.typeLabel || 'DOC'}</span>
                      ${d.author ? `<div class="avatar flex-shrink-0" title="${d.author.name}">${agentInitials(d.author.name)}</div>` : ''}
                      <span class="text-[10px] text-gray-400">${d.readingTime || '?'}m read</span>
                    </div>
                  </div>
                  <span class="text-[10px] text-gray-400 flex-shrink-0">${timeAgo(d.modifiedAt)}</span>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }).join('');
    }

    function toggleDocGroup(project) {
      if (collapsedGroups.has(project)) {
        collapsedGroups.delete(project);
      } else {
        collapsedGroups.add(project);
      }
      renderDocList();
    }

    async function loadDoc(path, title, typeLabel, readingTime) {
      const reader = document.getElementById('doc-reader');
      const titleEl = document.getElementById('reader-title');
      const metaEl = document.getElementById('reader-meta');

      titleEl.textContent = title;
      metaEl.textContent = typeLabel + ' // ' + (readingTime || '?') + 'M READ';
      reader.innerHTML = '<div class="flex items-center justify-center h-32"><span class="text-[11px] text-gray-400">Loading...</span></div>';

      try {
        const res = await fetch('/docs/' + path);
        if (!res.ok) throw new Error('Not found');
        const text = await res.text();

        if (typeof marked !== 'undefined') {
          reader.innerHTML = marked.parse(text);
        } else {
          reader.innerHTML = '<pre style="white-space:pre-wrap;font-size:11px;color:#4B5563;">' + text.replace(/</g, '&lt;') + '</pre>';
        }
      } catch (err) {
        reader.innerHTML = '<div class="flex items-center justify-center h-32"><span class="text-[11px] text-red-400">Failed to load document</span></div>';
      }
    }

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderDocList();
    });

    loadDocs();
  </script>
</body>
