<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherlock Labs | Team</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-violet: #8B5CF6;
      --surface-low: #F9FAFB;
      --text-main: #374151;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #FAFAFA;
      color: var(--text-main);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .premium-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
    }

    .subtle-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-pill {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .agent-card {
      background: white;
      border: 1px solid #F3F4F6;
      border-radius: 6px;
      padding: 14px 16px;
      transition: border-color 100ms ease;
    }

    .agent-card:hover {
      border-color: #E5E7EB;
    }

    .agent-card {
      cursor: pointer;
      user-select: none;
    }

    .agent-card.expanded {
      border-color: #D1D5DB;
    }

    .agent-detail {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #F3F4F6;
    }

    .agent-card.expanded .agent-detail {
      display: block;
    }

    /* Profile panel */
    .profile-overlay {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: 520px; max-width: 90vw;
      background: white; border-left: 1px solid #E5E7EB;
      z-index: 50; transform: translateX(100%);
      transition: transform 200ms ease;
      overflow-y: auto;
    }
    .profile-overlay.open { transform: translateX(0); }
    .profile-overlay .profile-md {
      font-size: 0.75rem; line-height: 1.7; color: #374151;
    }
    .profile-overlay .profile-md h1 { font-size: 1.1rem; font-weight: 700; margin: 0 0 8px; color: #000; }
    .profile-overlay .profile-md h2 { font-size: 0.85rem; font-weight: 700; margin: 20px 0 6px; color: #000; border-bottom: 1px solid #F3F4F6; padding-bottom: 4px; }
    .profile-overlay .profile-md h3 { font-size: 0.78rem; font-weight: 600; margin: 14px 0 4px; color: #374151; }
    .profile-overlay .profile-md p { margin: 6px 0; }
    .profile-overlay .profile-md ul, .profile-overlay .profile-md ol { margin: 6px 0; padding-left: 20px; }
    .profile-overlay .profile-md li { margin: 3px 0; }
    .profile-overlay .profile-md code { font-size: 0.7rem; background: #F3F4F6; padding: 1px 4px; border-radius: 2px; }
    .profile-overlay .profile-md pre { background: #F9FAFB; border: 1px solid #F3F4F6; border-radius: 4px; padding: 10px; overflow-x: auto; font-size: 0.7rem; margin: 8px 0; }
    .profile-overlay .profile-md strong { font-weight: 600; }
    .profile-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.1); z-index: 40;
      opacity: 0; pointer-events: none; transition: opacity 200ms ease;
    }
    .profile-backdrop.open { opacity: 1; pointer-events: auto; }

    .avatar-lg {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #F3F4F6;
    }

    .avatar-lg-fallback {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #6B7280;
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #E5E7EB;
      border-radius: 2px;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>

    <!-- Main Content -->
    <div class="flex-1 ml-52 p-5">

      <!-- Top Status Bar -->
      <header class="mb-5 flex items-center justify-between py-2 px-4 bg-white border border-gray-100 rounded-lg premium-shadow">

  <!-- Profile slide-over panel -->

          <div>
            <div class="text-[13px] font-bold text-black" id="profile-name"></div>
            <div class="text-[11px] text-gray-500" id="profile-role"></div>

        <button onclick="closeProfile()" class="text-gray-400 hover:text-black p-1">

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>

  <script>
    const AGENTS = [
      { name: 'Thomas', role: 'Product Manager', tag: 'PM', tagColor: '#8B5CF6', reports: 'CEO', capabilities: 'Translates CEO vision into prioritized, scoped work items. Owns the backlog and acceptance criteria. Runs the pipeline autonomously from scoping through QA.' },
      { name: 'Robert', role: 'Product Designer', tag: 'DESIGN', tagColor: '#EC4899', reports: 'Thomas', capabilities: 'Designs user flows, wireframes, and interaction specs. Leads with usability over aesthetics. Reviews implementations against the design spec before QA.' },
      { name: 'Andrei', role: 'Technical Architect', tag: 'ARCH', tagColor: '#6366F1', reports: 'CEO', capabilities: 'Defines system architecture, tech stack, and conventions. Makes build-vs-buy decisions. Picks boring, proven technology unless there is a compelling reason not to.' },
      { name: 'Alice', role: 'Front-End Developer', tag: 'FE', tagColor: '#3B82F6', reports: 'Thomas', capabilities: 'Owns the entire frontend surface — implementation, interactions, responsive design, and accessibility. Animations, breakpoints, WCAG compliance, and pixel-perfect polish all in one role.' },
      { name: 'Jonah', role: 'Back-End Developer', tag: 'BE', tagColor: '#10B981', reports: 'Thomas', capabilities: 'Builds APIs, services, data models, and server-side logic. Thinks in systems and failure modes. Keeps APIs simple and consistent.' },
      { name: 'Sam', role: 'Back-End Developer', tag: 'BE', tagColor: '#10B981', reports: 'Jonah', capabilities: 'Jonah\'s counterpart. Picks up backend work in parallel -- APIs, data models, server logic. Follows Jonah\'s patterns for consistency.' },
      { name: 'Enzo', role: 'QA Engineer', tag: 'QA', tagColor: '#EF4444', reports: 'Thomas', capabilities: 'Tests everything: happy paths, edge cases, error states. Writes automated tests and test plans. QA is a release gate -- nothing ships without a pass.' },
      { name: 'Priya', role: 'Product Marketer', tag: 'MKT', tagColor: '#F59E0B', reports: 'Thomas', capabilities: 'Writes positioning, product copy, and feature announcements. Thinks in headlines. Clear, sharp messaging with no fluff.' },
      { name: 'Suki', role: 'Market Researcher', tag: 'RESEARCH', tagColor: '#14B8A6', reports: 'Thomas', capabilities: 'Researches competitors, market trends, and user patterns. Delivers actionable insights. Focused and time-boxed research.' },
      { name: 'Marco', role: 'Technical Researcher', tag: 'RESEARCH', tagColor: '#14B8A6', reports: 'Andrei', capabilities: 'Evaluates libraries, reads API docs, and produces technical research briefs. Recommends one path with clear rationale.' },
      { name: 'Nadia', role: 'Technical Writer', tag: 'DOCS', tagColor: '#64748B', reports: 'Thomas', capabilities: 'Writes user guides, maintains READMEs, and keeps documentation current. Concise docs that people actually read.' },
      { name: 'Yuki', role: 'Data Analyst', tag: 'DATA', tagColor: '#0EA5E9', reports: 'Thomas', capabilities: 'Analyzes project data, identifies patterns, and produces metrics reports. Runs post-project retrospective analysis.' },
      { name: 'Kai', role: 'AI/Prompt Engineer', tag: 'AI', tagColor: '#A855F7', reports: 'Andrei', capabilities: 'Designs prompts, optimizes AI integrations, and advises on Claude CLI usage. Keeps AI integrations lean and practical.' },
      { name: 'Zara', role: 'Mobile Developer', tag: 'MOBILE', tagColor: '#F97316', reports: 'Thomas', capabilities: 'Builds React Native/Expo mobile apps. Expert in native feel, performance, and platform conventions.' },
      { name: 'Leo', role: 'Mobile Developer', tag: 'MOBILE', tagColor: '#F97316', reports: 'Thomas', capabilities: 'Builds React Native/Expo mobile apps. Expert in animations, gestures, and micro-interactions.' },
      { name: 'Howard', role: 'Payments Engineer', tag: 'PAY', tagColor: '#059669', reports: 'Jonah', capabilities: 'Builds payment flows, billing logic, and Stripe integrations. Expert in subscriptions, webhooks, and PCI compliance.' },
      { name: 'Ravi', role: 'Creative Strategist', tag: 'STRATEGY', tagColor: '#DC2626', reports: 'CEO', capabilities: 'Creative business strategist. Generates product ideas, spots non-obvious opportunities, and challenges assumptions.' },
      { name: 'Derek', role: 'BE Integrations', tag: 'BE', tagColor: '#10B981', reports: 'Jonah', capabilities: 'Wires up third-party services: Clerk, Stripe, Loops, R2. Webhooks, OAuth, API syncs, and data flow between systems.' },
      { name: 'Milo', role: 'BE DevOps / CI-CD', tag: 'DEVOPS', tagColor: '#78716C', reports: 'Andrei', capabilities: 'CI/CD, Railway config, database migrations, monitoring. Keeps the pipeline green and deploys boring.' },
      { name: 'Morgan', role: 'Visual QA', tag: 'QA', tagColor: '#EF4444', reports: 'Enzo', capabilities: 'Conducts pixel-perfect design reviews and responsiveness tests. Ensures fit and finish matches the design spec.' },
      { name: 'Atlas', role: 'Code Reviewer', tag: 'REVIEW', tagColor: '#7C3AED', reports: 'Andrei', capabilities: 'Conducts pragmatic code reviews focusing on architecture, security, and maintainability.' },
    ];

    const AVATAR_NAMES = new Set([
      'alice','amara','andrei','derek','enzo','howard','jonah','kai','leo',
      'marco','milo','nadia','nina','priya','ravi','robert','sam','soren',
      'suki','thomas','yuki','zara'
    ]);

    function agentAvatar(name, size = 'lg') {
      const slug = name.toLowerCase();
      if (AVATAR_NAMES.has(slug)) {
        return `<img src="img/avatars/${slug}.svg" alt="${name}" class="avatar-${size} flex-shrink-0">`;
      }
      return `<div class="avatar-${size}-fallback flex-shrink-0">${name.slice(0,2).toUpperCase()}</div>`;
    }

    let expandedAgent = null;

    function toggleAgent(name) {
      if (expandedAgent === name) {
        expandedAgent = null;
      } else {
        expandedAgent = name;
      }
      renderAgents();
    }

    function renderAgents() {
      const grid = document.getElementById('agent-grid');
      grid.innerHTML = AGENTS.map(a => {
        const isExpanded = expandedAgent === a.name;
        return `
        <div class="agent-card premium-shadow ${isExpanded ? 'expanded' : ''}" onclick="toggleAgent('${a.name}')">
          <div class="flex items-start gap-3 mb-2">
            ${agentAvatar(a.name)}
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2">
                <span class="text-[12px] font-bold text-black">${a.name}</span>
                <span class="tag-pill" style="color:${a.tagColor};background:${a.tagColor}15">${a.tag}</span>
                <svg class="w-2.5 h-2.5 text-gray-400 ml-auto flex-shrink-0 transition-transform duration-150 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
              </div>
              <div class="text-[11px] text-gray-500 mt-0.5">${a.role}</div>
            </div>
          </div>
          <div class="flex items-center gap-1 mt-1">
            <span class="text-[10px] text-gray-400 uppercase tracking-wide">Reports to:</span>
            <span class="text-[10px] font-medium text-gray-600">${a.reports}</span>
          </div>
          <div class="agent-detail">
            <div class="text-[11px] text-gray-500 leading-relaxed mb-2">${a.capabilities}</div>
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-[10px] text-gray-400 uppercase tracking-wide">Model:</span>
                <span class="text-[10px] font-bold text-gray-600">OPUS</span>
              </div>
              <button onclick="openProfile('${a.name}')" class="text-[10px] font-bold text-blue-500 hover:text-blue-600 uppercase tracking-wide">View Full Profile →</button>
            </div>
          </div>
        </div>
      `}).join('');
    }

    renderAgents();

    // --- Profile panel ---
    const profilePanel = document.getElementById('profile-panel');
    const profileBackdrop = document.getElementById('profile-backdrop');
    const profileName = document.getElementById('profile-name');
    const profileRole = document.getElementById('profile-role');
    const profileAvatar = document.getElementById('profile-avatar');
    const profileContent = document.getElementById('profile-content');

    function closeProfile() {
      profilePanel.classList.remove('open');
      profileBackdrop.classList.remove('open');
    }

    profileBackdrop.addEventListener('click', closeProfile);

    async function openProfile(name) {
      event.stopPropagation();
      const agent = AGENTS.find(a => a.name === name);
      if (!agent) return;

      profileName.textContent = agent.name;
      profileRole.textContent = agent.role;
      profileAvatar.innerHTML = agentAvatar(agent.name);
      profileContent.innerHTML = '<div class="text-[11px] text-gray-400 py-8 text-center">Loading profile...</div>';
      profilePanel.classList.add('open');
      profileBackdrop.classList.add('open');

      try {
        const res = await fetch('/api/agents/' + name.toLowerCase() + '/profile');
        if (!res.ok) throw new Error('Not found');
        const md = await res.text();
        // Strip frontmatter
        const cleaned = md.replace(/^---[\s\S]*?---\s*/, '');
        profileContent.innerHTML = '<div class="profile-md">' + marked.parse(cleaned) + '</div>';
      } catch {
        profileContent.innerHTML = '<div class="text-[11px] text-gray-400 py-8 text-center">Profile not available</div>';
      }
    }
  </script>
</body>
</html>
