<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-violet: #8B5CF6;
      --surface-low: #F9FAFB;
      --text-main: #374151;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #FAFAFA;
      color: var(--text-main);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .premium-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
    }

    .subtle-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-pill {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block;
    }

    .avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid white;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6px;
      font-weight: 700;
      color: #6B7280;
    }

    .task-row {
      transition: background-color 100ms ease;
    }

    .task-row:hover {
      background-color: #F9FAFB;
    }

    .task-row.task-row--selected {
      background-color: #EFF6FF;
      border-left: 2px solid #3B82F6;
    }

    .status-pill-btn {
      cursor: pointer;
      transition: opacity 100ms ease, transform 80ms ease;
      border: none;
      background: none;
      padding: 0;
      font: inherit;
    }

    .status-pill-btn:hover {
      opacity: 0.75;
      transform: scale(1.05);
    }

    .status-pill-btn:active {
      transform: scale(0.95);
    }

    .task-detail-panel {
      background: #F9FAFB;
      border-top: 1px solid #F3F4F6;
      padding: 8px 16px 8px 40px;
      display: none;
    }

    .task-detail-panel.visible {
      display: block;
    }

    .saving-indicator {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: #000;
      color: #fff;
      padding: 6px 14px;
      font-size: 0.7rem;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 200ms ease, transform 200ms ease;
    }

    .saving-indicator.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .saving-indicator.error {
      background: #EF4444;
    }

    .filter-tab {
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 100ms ease;
    }

    .filter-tab:hover {
      color: var(--text-main);
    }

    .filter-tab.active {
      background: #F3F4F6;
      color: var(--text-main);
    }

    .project-group-header {
      cursor: pointer;
      user-select: none;
      transition: background-color 100ms ease;
    }

    .project-group-header:hover {
      background-color: #F3F4F6;
    }

    .chevron {
      transition: transform 150ms ease;
    }

    .chevron.collapsed {
      transform: rotate(-90deg);
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #E5E7EB;
      border-radius: 2px;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>

  <script>
    const API_BASE = '/api';

    const STATUS_COLORS = {
      'planned': '#9CA3AF',
      'in-progress': '#3B82F6',
      'completed': '#10B981',
      'blocked': '#EF4444',
      'deferred': '#F59E0B',
    };

    const STATUS_LABELS = {
      'planned': 'PLANNED',
      'in-progress': 'IN_PROGRESS',
      'completed': 'COMPLETED',
      'blocked': 'BLOCKED',
      'deferred': 'DEFERRED',
    };

    const AVATAR_NAMES = new Set([
      'alice','amara','andrei','derek','enzo','howard','jonah','kai','leo',
      'marco','milo','nadia','nina','priya','ravi','robert','sam','soren',
      'suki','thomas','yuki','zara'
    ]);

    function agentAvatar(name) {
      if (!name) return '';
      const slug = name.toLowerCase();
      if (AVATAR_NAMES.has(slug)) {
        return `<img src="img/avatars/${slug}.svg" alt="${name}" class="w-[18px] h-[18px] rounded-full object-cover flex-shrink-0" title="${name}">`;
      }
      return `<div class="avatar flex-shrink-0" title="${name}">${name.slice(0,2).toUpperCase()}</div>`;
    }

    let allTasks = []; // { ...task, projectName, projectSlug }
    let currentFilter = 'all';
    let searchQuery = '';
    let collapsedGroups = new Set();

    async function loadTasks() {
      try {
        const projRes = await fetch(API_BASE + '/projects');
        const projData = await projRes.json();
        const projects = projData.projects || [];

        // Fetch work items for each project in parallel
        const taskPromises = projects.map(async (p) => {
          try {
            const res = await fetch(API_BASE + '/projects/' + p.id + '/work-items');
            const data = await res.json();
            return (data.workItems || []).map(t => ({
              ...t,
              projectName: p.name,
              projectSlug: p.slug,
              projectId: p.id,
            }));
          } catch {
            return [];
          }
        });

        const taskArrays = await Promise.all(taskPromises);
        allTasks = taskArrays.flat();

        // Update header stats
        document.getElementById('header-total').textContent = allTasks.length;
        document.getElementById('header-progress').textContent = allTasks.filter(t => t.status === 'in-progress').length;
        document.getElementById('header-completed').textContent = allTasks.filter(t => t.status === 'completed').length;
        document.getElementById('last-updated').textContent = 'UPDATED ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        renderTasks();
      } catch (err) {
        console.error('Failed to load tasks:', err);
        document.getElementById('tasks-container').innerHTML =
          '<div class="bg-white border border-gray-100 rounded-lg premium-shadow px-4 py-8 text-center text-[11px] text-gray-400">Failed to load tasks</div>';
      }
    }

    function renderTasks() {
      let filtered = allTasks;

      if (currentFilter !== 'all') {
        filtered = filtered.filter(t => t.status === currentFilter);
      }

      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t =>
          (t.title || '').toLowerCase().includes(q) ||
          (t.id || '').toLowerCase().includes(q) ||
          (t.owner || '').toLowerCase().includes(q)
        );
      }

      // Group by project
      const groups = {};
      filtered.forEach(t => {
        const key = t.projectName || 'Uncategorized';
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
      });

      const container = document.getElementById('tasks-container');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-white border border-gray-100 rounded-lg premium-shadow px-4 py-8 text-center text-[11px] text-gray-400">No tasks found</div>';
        return;
      }

      container.innerHTML = Object.entries(groups).map(([projectName, tasks]) => {
        const isCollapsed = collapsedGroups.has(projectName);
        const completedCount = tasks.filter(t => t.status === 'completed').length;

        return `
          <div class="bg-white border border-gray-100 rounded-lg premium-shadow overflow-hidden mb-3">
            <div class="project-group-header flex items-center justify-between px-4 py-2.5 border-b border-gray-50"
                 onclick="toggleGroup('${projectName.replace(/'/g, "\\'")}')">
              <div class="flex items-center gap-2">
                <svg class="w-3 h-3 text-gray-400 chevron ${isCollapsed ? 'collapsed' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
                <span class="text-[12px] font-bold text-black">${projectName}</span>
                <span class="text-[11px] text-gray-400">${completedCount}/${tasks.length}</span>
              </div>
              <span class="tag-pill text-violet-600 bg-violet-50">${tasks.length} TASKS</span>
            </div>
            ${isCollapsed ? '' : `
              <div class="divide-y divide-gray-50">
                ${tasks.map(t => {
                  const color = STATUS_COLORS[t.status] || '#9CA3AF';
                  const label = STATUS_LABELS[t.status] || t.status.toUpperCase();
                  const isSelected = selectedTaskId === t.id && selectedTaskProject === t.projectId;
                  return `
                    <div class="task-row flex items-center gap-3 px-4 py-2 cursor-pointer ${isSelected ? 'task-row--selected' : ''}"
                         onclick="selectTask('${escapeAttr(t.projectId)}', '${escapeAttr(t.id)}')">
                      <span class="status-dot flex-shrink-0" style="background:${color}"></span>
                      <span class="text-[11px] text-gray-400 font-medium flex-shrink-0 w-12">${t.id || '---'}</span>
                      <span class="text-[12px] text-black truncate flex-1">${t.title || 'Untitled'}</span>
                      ${t.owner ? agentAvatar(t.owner) : ''}
                      <button class="status-pill-btn flex-shrink-0" onclick="event.stopPropagation(); cycleStatus('${escapeAttr(t.projectId)}', '${escapeAttr(t.id)}')" title="Click to change status">
                        <span class="tag-pill" style="color:${color};background:${color}11">${label}</span>
                      </button>
                    </div>
                    <div class="task-detail-panel ${isSelected ? 'visible' : ''}" id="task-detail-${escapeAttr(t.projectId)}-${escapeAttr(t.id)}">
                      <div class="flex items-center gap-4 text-[11px]">
                        <span class="text-gray-400">Status:</span>
                        <span class="font-medium" style="color:${color}">${label}</span>
                        ${t.owner ? `<span class="text-gray-400 ml-2">Owner:</span><span class="font-medium text-gray-600">${t.owner}</span>` : ''}
                        <span class="text-gray-400 ml-2">Project:</span>
                        <span class="font-medium text-gray-600">${t.projectName}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </div>
        `;
      }).join('');
    }

    function toggleGroup(name) {
      if (collapsedGroups.has(name)) {
        collapsedGroups.delete(name);
      } else {
        collapsedGroups.add(name);
      }
      renderTasks();
    }

    // Filter tab clicks
    document.getElementById('filter-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderTasks();
    });

    // Search
    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTasks();
    });

    let selectedTaskId = null;
    let selectedTaskProject = null;

    function escapeAttr(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function selectTask(projectId, taskId) {
      if (selectedTaskId === taskId && selectedTaskProject === projectId) {
        selectedTaskId = null;
        selectedTaskProject = null;
      } else {
        selectedTaskId = taskId;
        selectedTaskProject = projectId;
      }
      renderTasks();
    }

    const STATUS_CYCLE = ['planned', 'in-progress', 'completed', 'blocked'];

    async function cycleStatus(projectId, taskId) {
      const task = allTasks.find(t => t.projectId === projectId && t.id === taskId);
      if (!task) return;

      const currentIdx = STATUS_CYCLE.indexOf(task.status);
      const nextStatus = STATUS_CYCLE[(currentIdx + 1) % STATUS_CYCLE.length];

      // Optimistic update
      task.status = nextStatus;
      renderTasks();
      updateHeaderStats();

      // Save to server
      showSaving('Saving...');
      try {
        // Fetch all work items for this project
        const res = await fetch(API_BASE + '/projects/' + projectId + '/work-items');
        const data = await res.json();
        const workItems = data.workItems || [];

        // Update the specific task
        const item = workItems.find(w => w.id === taskId);
        if (item) {
          item.status = nextStatus;
        }

        // Save back
        const saveRes = await fetch(API_BASE + '/projects/' + projectId + '/work-items', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workItems }),
        });

        if (!saveRes.ok) throw new Error('Failed to save');
        showSaving('Saved', false, 1500);
      } catch (err) {
        console.error('Failed to save status:', err);
        showSaving('Failed to save', true, 3000);
        // Reload to get correct state
        loadTasks();
      }
    }

    function updateHeaderStats() {
      document.getElementById('header-total').textContent = allTasks.length;
      document.getElementById('header-progress').textContent = allTasks.filter(t => t.status === 'in-progress').length;
      document.getElementById('header-completed').textContent = allTasks.filter(t => t.status === 'completed').length;
    }

    function showSaving(msg, isError = false, autoDismiss = 0) {
      let el = document.getElementById('saving-indicator');
      if (!el) {
        el = document.createElement('div');
        el.id = 'saving-indicator';
        el.className = 'saving-indicator';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.toggle('error', isError);
      el.classList.add('visible');

      if (autoDismiss > 0) {
        setTimeout(() => { el.classList.remove('visible'); }, autoDismiss);
      } else {
        // Will be dismissed by next call
      }
    }

    loadTasks();
  </script>
</body>
</html>
