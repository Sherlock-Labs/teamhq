<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherlock Labs | Projects</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-violet: #8B5CF6;
      --surface-low: #F9FAFB;
      --text-main: #374151;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #FAFAFA;
      color: var(--text-main);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .premium-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
    }

    .subtle-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-pill {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      display: inline-block;
    }

    .avatar {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid white;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6px;
      font-weight: 700;
      color: #6B7280;
    }

    .project-row {
      transition: background-color 100ms ease;
    }

    .project-row:hover {
      background-color: #F9FAFB;
    }

    .project-row:hover .row-actions {
      opacity: 1;
    }

    .row-actions {
      opacity: 0;
      transition: opacity 100ms ease;
    }

    .filter-tab {
      padding: 3px 10px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 3px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 100ms ease;
    }

    .filter-tab:hover {
      color: var(--text-main);
    }

    .filter-tab.active {
      background: #F3F4F6;
      color: var(--text-main);
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #E5E7EB;
      border-radius: 2px;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }

    /* Toggle switch for review gates */
    .toggle-switch {
      position: relative;
      width: 28px;
      height: 16px;
      appearance: none;
      -webkit-appearance: none;
      background: #E5E7EB;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms ease;
      border: none;
      outline: none;
      flex-shrink: 0;
    }
    .toggle-switch:checked {
      background: #10B981;
    }
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      transition: transform 150ms ease;
    }
    .toggle-switch:checked::after {
      transform: translateX(12px);
    }
    .toggle-switch:focus-visible {
      outline: 2px solid #006B3F;
      outline-offset: 2px;
    }
    .toggle-switch:hover {
      background: #D1D5DB;
    }
    .toggle-switch:checked:hover {
      background: #059669;
    }
    .gate-toggle:hover {
      background: #F9FAFB;
    }
    .gate-saved-indicator {
      font-size: 9px;
      color: #10B981;
      font-weight: 500;
      opacity: 0;
      transition: opacity 200ms ease;
    }
    .gate-saved-indicator.visible {
      opacity: 1;
    }

    .review-nav-badge {
      background: #EF4444;
      color: white;
      font-size: 8px;
      font-weight: 700;
      min-width: 14px;
      height: 14px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      margin-left: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle-switch, .toggle-switch::after, .gate-saved-indicator {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    const API_BASE = '/api';

    const STATUS_MAP = {
      'in-progress': { label: 'ACTIVE', color: '#3B82F6', bg: '#3B82F611' },
      'completed': { label: 'SHIPPED', color: '#10B981', bg: '#10B98111' },
      'planned': { label: 'PLANNED', color: '#9CA3AF', bg: '#9CA3AF11' },
    };

    function timeAgo(ts) {
      if (!ts) return '---';
      const diff = Date.now() - new Date(ts).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return mins + 'm ago';
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return hrs + 'h ago';
      const days = Math.floor(hrs / 24);
      return days + 'd ago';
    }

    function projectInitials(name) {
      if (!name) return '??';
      const words = name.split(/[\s\-_]+/).filter(w => w.length > 0);
      if (words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    let allProjects = [];
    let currentFilter = 'all';

    async function loadProjects() {
      try {
        const res = await fetch(API_BASE + '/projects');
        const data = await res.json();
        allProjects = (data.projects || []).sort((a, b) =>
          new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)
        );

        const active = allProjects.filter(p => p.status === 'in-progress').length;
        const shipped = allProjects.filter(p => p.status === 'completed').length;

        document.getElementById('header-total').textContent = allProjects.length;
        document.getElementById('header-active').textContent = active;
        document.getElementById('header-shipped').textContent = shipped;
        document.getElementById('last-updated').textContent = 'UPDATED ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        renderProjects();
      } catch (err) {
        console.error('Failed to load projects:', err);
        document.getElementById('projects-list').innerHTML =
          '<div class="px-4 py-8 text-center text-[11px] text-gray-400">Failed to load projects</div>';
      }
    }

    function renderProjects() {
      const filtered = currentFilter === 'all'
        ? allProjects
        : allProjects.filter(p => p.status === currentFilter);

      const el = document.getElementById('projects-list');

      if (filtered.length === 0) {
        el.innerHTML = '<div class="px-4 py-8 text-center text-[11px] text-gray-400">No projects found</div>';
        return;
      }

      el.innerHTML = filtered.map(p => {
        const s = STATUS_MAP[p.status] || STATUS_MAP['planned'];
        const initials = projectInitials(p.name);
        const wi = p.workItems || {};
        const taskCount = wi.total || 0;
        const agentCount = (wi.owners || []).length;

        return `
          <div class="project-row-wrapper" data-project-id="${p.id}">
            <div class="project-row grid grid-cols-12 gap-2 px-4 py-2.5 items-center cursor-pointer" onclick="toggleProject('${p.id}')">
              <div class="col-span-1">
                <div class="w-7 h-7 rounded bg-gray-50 border border-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-500">${initials}</div>
              </div>
              <div class="col-span-5 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="status-dot flex-shrink-0" style="background:${s.color}"></span>
                  <span class="text-[12px] font-medium text-black truncate">${p.name}</span>
                  <svg class="w-3 h-3 text-gray-400 chevron-icon flex-shrink-0 transition-transform duration-150" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                </div>
                <div class="text-[11px] text-gray-400 mt-0.5 truncate ml-[13px]">${p.description ? p.description.slice(0, 80) + (p.description.length > 80 ? '...' : '') : 'No description'}</div>
              </div>
              <div class="col-span-2">
                <span class="tag-pill" style="color:${s.color};background:${s.bg}">${s.label}</span>
              </div>
              <div class="col-span-2">
                <div class="flex items-center gap-3">
                  <span class="text-[11px] text-gray-500">${taskCount} tasks</span>
                  <span class="text-[11px] text-gray-400">${agentCount} agents</span>
                </div>
              </div>
              <div class="col-span-2 text-right">
                <span class="text-[11px] text-gray-400">${timeAgo(p.updatedAt || p.createdAt)}</span>
              </div>
            </div>
            <div class="project-detail hidden" id="detail-${p.id}">
              <div class="px-4 py-3 bg-gray-50 border-t border-gray-100">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="skeleton w-4 h-4 inline-block rounded-full"></span>
                  <span class="text-[11px] text-gray-400">Loading details...</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Filter tab clicks
    document.getElementById('filter-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.filter-tab');
      if (!tab) return;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      renderProjects();
    });

    async function createProject() {
      const name = document.getElementById('np-name').value.trim();
      const desc = document.getElementById('np-desc').value.trim();
      const brief = document.getElementById('np-brief').value.trim();
      const status = document.getElementById('np-status').value;
      if (!name) return alert('Name is required');

      const reviewGates = {
        afterRequirements: document.getElementById('np-gate-req').checked,
        afterArchitecture: document.getElementById('np-gate-arch').checked,
        afterDesign: document.getElementById('np-gate-design').checked,
        afterBackend: document.getElementById('np-gate-backend').checked,
        afterFrontend: document.getElementById('np-gate-frontend').checked,
        afterQA: document.getElementById('np-gate-qa').checked,
      };

      try {
        const res = await fetch(API_BASE + '/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, description: desc, status, goals: '', constraints: '', brief, reviewGates }),
        });
        if (!res.ok) { const err = await res.json(); alert(err.error || 'Failed'); return; }
        document.getElementById('new-project-modal').classList.add('hidden');
        document.getElementById('np-name').value = '';
        document.getElementById('np-desc').value = '';
        document.getElementById('np-brief').value = '';
        loadProjects();
      } catch (err) { alert('Failed to create project'); }
    }

    let expandedProjectId = null;
    const projectDetailCache = {};

    async function toggleProject(id) {
      const wrapper = document.querySelector(`[data-project-id="${id}"]`);
      if (!wrapper) return;
      const detail = wrapper.querySelector('.project-detail');
      const chevron = wrapper.querySelector('.chevron-icon');

      // If already expanded, collapse
      if (expandedProjectId === id) {
        detail.classList.add('hidden');
        chevron.style.transform = '';
        expandedProjectId = null;
        return;
      }

      // Collapse previously expanded
      if (expandedProjectId) {
        const prev = document.querySelector(`[data-project-id="${expandedProjectId}"]`);
        if (prev) {
          prev.querySelector('.project-detail')?.classList.add('hidden');
          const prevChevron = prev.querySelector('.chevron-icon');
          if (prevChevron) prevChevron.style.transform = '';
        }
      }

      expandedProjectId = id;
      detail.classList.remove('hidden');
      chevron.style.transform = 'rotate(180deg)';

      // Load details if not cached
      if (!projectDetailCache[id]) {
        try {
          const res = await fetch(API_BASE + '/projects/' + id);
          if (!res.ok) throw new Error('Failed');
          projectDetailCache[id] = await res.json();
        } catch (err) {
          detail.innerHTML = `<div class="px-4 py-3 bg-gray-50 border-t border-gray-100"><span class="text-[11px] text-red-400">Failed to load project details</span></div>`;
          return;
        }
      }

      renderProjectDetail(id, detail);
    }

    function renderProjectDetail(id, container) {
      const p = projectDetailCache[id];
      if (!p) return;

      const sections = [];

      if (p.description) {
        sections.push(`
          <div class="mb-3">
            <div class="subtle-label mb-1">Description</div>
            <div class="text-[11px] text-gray-600 leading-relaxed">${escapeHtml(p.description)}</div>
          </div>
        `);
      }

      if (p.brief) {
        sections.push(`
          <div class="mb-3">
            <div class="subtle-label mb-1">Brief</div>
            <div class="text-[11px] text-gray-600 leading-relaxed">${escapeHtml(p.brief)}</div>
          </div>
        `);
      }

      if (p.goals) {
        sections.push(`
          <div class="mb-3">
            <div class="subtle-label mb-1">Goals</div>
            <div class="text-[11px] text-gray-600 leading-relaxed">${escapeHtml(p.goals)}</div>
          </div>
        `);
      }

      if (p.constraints) {
        sections.push(`
          <div class="mb-3">
            <div class="subtle-label mb-1">Constraints</div>
            <div class="text-[11px] text-gray-600 leading-relaxed">${escapeHtml(p.constraints)}</div>
          </div>
        `);
      }

      // Pipeline tasks
      if (p.pipeline && p.pipeline.tasks && p.pipeline.tasks.length > 0) {
        const taskRows = p.pipeline.tasks.map(t => {
          const statusColors = { planned: '#9CA3AF', 'in-progress': '#3B82F6', completed: '#10B981', blocked: '#EF4444' };
          const c = statusColors[t.status] || '#9CA3AF';
          return `<div class="flex items-center gap-2 py-1">
            <span class="status-dot flex-shrink-0" style="background:${c}"></span>
            <span class="text-[11px] text-gray-600 flex-1 truncate">${escapeHtml(t.agent || '')} - ${escapeHtml(t.title || t.role || '')}</span>
            <span class="tag-pill" style="color:${c};background:${c}11">${(t.status || 'planned').replace('-','_').toUpperCase()}</span>
          </div>`;
        }).join('');

        sections.push(`
          <div class="mb-2">
            <div class="subtle-label mb-1">Pipeline Tasks</div>
            <div class="divide-y divide-gray-100">${taskRows}</div>
          </div>
        `);
      }

      if (sections.length === 0) {
        sections.push(`<div class="text-[11px] text-gray-400">No additional details available</div>`);
      }

      // Review Gates section
      const gateConfig = buildGateConfigHTML(p);

      // Links
      const links = `
        <div class="flex items-center gap-3 mt-3 pt-3 border-t border-gray-100">
          <a href="tasks.html" class="text-[11px] text-blue-500 hover:text-blue-600 font-medium">VIEW TASKS</a>
        </div>
      `;

      container.innerHTML = `
        <div class="px-4 py-3 bg-gray-50 border-t border-gray-100">
          ${sections.join('')}
          ${gateConfig}
          ${links}
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(str));
      return d.innerHTML;
    }

    // --- Review Gates Configuration ---
    const GATE_DEFS = [
      { key: 'afterResearch',      label: 'After Research',      agent: 'Suki, Marco',  dot: '#38BDF8' },
      { key: 'afterRequirements',  label: 'After Requirements',  agent: 'Thomas',        dot: '#818CF8' },
      { key: 'afterArchitecture',  label: 'After Architecture',  agent: 'Andrei',        dot: '#A78BFA' },
      { key: 'afterDesign',        label: 'After Design',        agent: 'Robert',        dot: '#C084FC' },
      { key: 'afterBackend',       label: 'After Backend',       agent: 'Jonah, Sam',    dot: '#34D399' },
      { key: 'afterFrontend',      label: 'After Frontend',      agent: 'Alice',         dot: '#F472B6' },
      { key: 'afterQA',            label: 'After QA',            agent: 'Enzo',          dot: '#FBBF24' },
    ];

    function buildGateConfigHTML(project) {
      const gates = project.reviewGates || {};
      const rows = GATE_DEFS.map(g => {
        const checked = gates[g.key] ? 'checked' : '';
        return `
          <div class="gate-toggle flex items-center justify-between px-2 py-2 rounded">
            <div class="flex items-center gap-2.5">
              <span style="width:6px;height:6px;border-radius:50%;background:${g.dot};display:inline-block;flex-shrink:0;"></span>
              <span class="text-[11px] font-medium" style="color:#374151">${g.label}</span>
              <span class="text-[11px]" style="color:#9CA3AF">${g.agent}</span>
            </div>
            <input type="checkbox" class="toggle-switch" ${checked}
              role="switch" aria-checked="${!!gates[g.key]}" aria-label="Review gate: ${g.label}"
              onchange="toggleGate('${project.id}', '${g.key}', this)">
          </div>`;
      }).join('');

      return `
        <div class="gate-config border-t border-gray-100 pt-3 mt-3">
          <div class="flex items-center justify-between mb-3">
            <span class="subtle-label">REVIEW GATES</span>
            <div class="flex items-center gap-2">
              <span class="gate-saved-indicator" id="gate-saved-${project.id}">Saved</span>
              <span class="text-[11px]" style="color:#9CA3AF">Pipeline pauses for your review at enabled gates</span>
            </div>
          </div>
          <div class="flex flex-col">${rows}</div>
        </div>`;
    }

    async function toggleGate(projectId, gateKey, checkbox) {
      const project = projectDetailCache[projectId];
      if (!project) return;

      const gates = { ...(project.reviewGates || {}) };
      gates[gateKey] = checkbox.checked;
      checkbox.setAttribute('aria-checked', checkbox.checked);

      try {
        const res = await fetch(API_BASE + '/projects/' + projectId, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reviewGates: gates }),
        });

        if (!res.ok) throw new Error('Save failed');

        // Update cache
        project.reviewGates = gates;

        // Show saved indicator
        const indicator = document.getElementById('gate-saved-' + projectId);
        if (indicator) {
          indicator.classList.add('visible');
          setTimeout(() => indicator.classList.remove('visible'), 1500);
        }
      } catch (err) {
        // Revert toggle
        checkbox.checked = !checkbox.checked;
        checkbox.setAttribute('aria-checked', checkbox.checked);

        // Show error next to toggle
        const errSpan = document.createElement('span');
        errSpan.className = 'text-[11px] ml-2';
        errSpan.style.color = '#DC2626';
        errSpan.textContent = 'Save failed';
        checkbox.parentElement.appendChild(errSpan);
        setTimeout(() => errSpan.remove(), 2000);
      }
    }

    // --- Review Nav Badge ---
    async function loadReviewBadge() {
      try {
        const res = await fetch(API_BASE + '/reviews');
        const data = await res.json();
        const pending = (data.reviews || []).filter(r => r.status === 'pending').length;
        const badge = document.getElementById('nav-review-badge');
        if (badge) {
          if (pending > 0) {
            badge.textContent = pending;
            badge.style.display = '';
          } else {
            badge.style.display = 'none';
          }
        }
      } catch (e) { /* silent */ }
    }

    loadProjects();
    loadReviewBadge();
  </script>
</body>
</html>
