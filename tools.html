<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-green: #10B981;
      --accent-blue: #3B82F6;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-violet: #8B5CF6;
      --surface-low: #F9FAFB;
      --text-main: #374151;
      --text-muted: #9CA3AF;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background-color: #FAFAFA;
      color: var(--text-main);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .premium-shadow {
      box-shadow: 0 1px 2px rgba(0,0,0,0.02), 0 4px 12px rgba(0,0,0,0.03);
    }

    .subtle-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-pill {
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .tool-row {
      transition: background-color 100ms ease;
    }

    .tool-row:hover {
      background-color: #F9FAFB;
    }

    @keyframes skeleton-pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.7; }
    }

    .skeleton {
      background: #E5E7EB;
      border-radius: 2px;
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }
  </style>
</head>

    <!-- Main Content -->
    <div class="flex-1 ml-52 p-5">

      <!-- Top Status Bar -->

          <div class="flex flex-col">

              TOOLS

          <div class="flex flex-col">

        </div>

      <main>
        <!-- Tools Table -->
        <div class="bg-white border border-gray-100 rounded-lg premium-shadow overflow-hidden">
          <!-- Table Header -->
          <div class="grid grid-cols-12 gap-2 px-4 py-2 border-b border-gray-50">
            <div class="col-span-3 subtle-label">Repo</div>
            <div class="col-span-5 subtle-label">Description</div>
            <div class="col-span-2 subtle-label">Stack</div>
            <div class="col-span-2 subtle-label text-right">Link</div>
          </div>

          <!-- Tool Rows -->
          <div id="tools-list" class="divide-y divide-gray-50">
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="mt-10 pt-3 border-t border-gray-50 flex justify-between items-center text-[10px] text-gray-400 font-medium uppercase tracking-widest">
        <span>SHERLOCK_LABS // 2026</span>
        <span>TEAMHQ_V2.0</span>
      </footer>
    </div>

  <script>
    const TOOLS = [
      {
        name: 'ost-tool',
        displayName: 'OST Tool',
        desc: 'Opportunity Solution Tree -- Vite+React + Express',
        stack: 'Vite + React + Express',
        url: 'https://github.com/Sherlock-Labs/ost-tool',
      },
      {
        name: 'sherlockpdf',
        displayName: 'SherlockPDF',
        desc: 'PDF tools with Stripe billing',
        stack: 'Full-stack',
        url: 'https://github.com/Sherlock-Labs/sherlockpdf',
      },
      {
        name: 'pdf-splitter',
        displayName: 'PDF Splitter',
        desc: 'Client-side PDF splitter (single HTML file)',
        stack: 'Vanilla HTML',
        url: 'https://github.com/Sherlock-Labs/pdf-splitter',
      },
      {
        name: 'pdf-combiner',
        displayName: 'PDF Combiner',
        desc: 'Client-side PDF combiner (single HTML file)',
        stack: 'Vanilla HTML',
        url: 'https://github.com/Sherlock-Labs/pdf-combiner',
      },
      {
        name: 'sitesnap',
        displayName: 'SiteSnap',
        desc: 'Job site photo auto-organizer for solo contractors',
        stack: 'Expo + Express',
        url: 'https://github.com/Sherlock-Labs/sitesnap',
      },
      {
        name: 'quotevoice',
        displayName: 'QuoteVoice',
        desc: 'Voice-to-professional estimate for contractors',
        stack: 'Expo + Express',
        url: 'https://github.com/Sherlock-Labs/quotevoice',
      },
      {
        name: 'voicenote-pro',
        displayName: 'VoiceNote Pro',
        desc: 'Voice notes with AI structuring, RevenueCat IAP',
        stack: 'Expo + Express',
        url: 'https://github.com/Sherlock-Labs/voicenote-pro',
      },
    ];

    function repoInitials(name) {
      const parts = name.split('-');
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return name.slice(0, 2).toUpperCase();
    }

    function renderTools() {
      const el = document.getElementById('tools-list');
      el.innerHTML = TOOLS.map(t => `
        <div class="tool-row grid grid-cols-12 gap-2 px-4 py-2.5 items-center">
          <div class="col-span-3 flex items-center gap-2.5">
            <div class="w-7 h-7 rounded bg-gray-50 border border-gray-100 flex items-center justify-center text-[10px] font-bold text-gray-500">${repoInitials(t.name)}</div>
            <div>
              <span class="text-[12px] font-medium text-black">${t.displayName}</span>
              <span class="block text-[10px] text-gray-400 font-mono">${t.name}</span>
            </div>
          </div>
          <div class="col-span-5">
            <span class="text-[11px] text-gray-500">${t.desc}</span>
          </div>
          <div class="col-span-2">
            <span class="tag-pill text-violet-600 bg-violet-50">${t.stack}</span>
          </div>
          <div class="col-span-2 text-right">
            <a href="${t.url}" target="_blank" rel="noopener noreferrer"
               class="text-[11px] text-blue-500 hover:text-blue-600 font-medium">
              GITHUB
              <svg class="w-2.5 h-2.5 inline-block ml-0.5 -mt-px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
          </div>
        </div>
      `).join('');
    }

    renderTools();
  </script>
